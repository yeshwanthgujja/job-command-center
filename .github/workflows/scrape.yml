name: job-scrape

on:
  schedule:
    - cron: "30 3 * * *"      # 9:00 AM IST
  workflow_dispatch:

# FIX: Prevents overlapping runs from crashing into each other
concurrency:
  group: job-scrape-lock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - run: pip install -r requirements.txt
      
      - run: python scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOA_API_KEY: ${{ secrets.JOA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Commit and Push with Retry
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add job_data/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "jobs: $(date -u +%F-%H%M)"
          
          # FIX: Retry loop with rebase to handle GitHub race conditions
          for i in 1 2 3; do
            if git push; then
              echo "Push successful"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
